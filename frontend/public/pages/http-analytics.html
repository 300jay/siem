<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTTP Analytics · NetworkOps</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<!-- data-page tells common.js which sidebar item to highlight -->
<body data-page="http">

  <div class="app-container">
    <!-- common.js inserts the sidebar here -->
    <main class="main-content">
      <!-- common.js inserts the top header here -->
      <div class="page-content">

        <div class="page-header">
          <h1>HTTP Analytics</h1>
          <p class="page-description">Web request volume, how fast endpoints respond, and which ones are returning errors.</p>
        </div>

        <div class="page-controls">
          <button class="btn" id="refresh-btn">↻ Refresh</button>
          <button class="btn btn-primary export-btn">⬇ Export CSV</button>
        </div>

        <div id="http-summary" class="stat-grid" style="margin-bottom:20px">
          <div class="loading">Loading summary</div>
        </div>

        <div class="panel-grid">
          <div class="panel panel-wide">
            <div class="panel-header">
              <h3>Response Status Codes</h3>
              <span class="panel-meta">share of all requests</span>
            </div>
            <div id="status-bars"><div class="loading">Loading</div></div>
          </div>
        </div>

        <div class="panel panel-wide">
          <div class="panel-header">
            <h3>Endpoints</h3>
            <span class="panel-meta">busiest first</span>
          </div>
          <div class="table-wrap">
            <table class="data-table" id="http-table">
              <thead>
                <tr><th>Path</th><th>Method</th><th>Requests</th><th>Avg Response</th><th>Status</th></tr>
              </thead>
              <tbody><tr><td colspan="5"><div class="loading">Loading</div></td></tr></tbody>
            </table>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script src="../js/common.js"></script>
  <script src="../js/http-analytics.js"></script>
</body>
</html>
