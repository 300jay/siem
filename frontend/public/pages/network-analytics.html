<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Network Analytics · NetworkOps</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<!-- data-page tells common.js which sidebar item to highlight -->
<body data-page="network">

  <div class="app-container">
    <!-- common.js inserts the sidebar here -->
    <main class="main-content">
      <!-- common.js inserts the top header here -->
      <div class="page-content">

        <div class="page-header">
          <h1>Network Analytics</h1>
          <p class="page-description">Which protocols are in use, how much they carry, and how the network is performing.</p>
        </div>

        <div class="page-controls">
          <button class="btn" id="refresh-btn">↻ Refresh</button>
          <button class="btn btn-primary export-btn">⬇ Export CSV</button>
        </div>

        <div id="perf-stats" class="stat-grid" style="margin-bottom:20px">
          <div class="loading">Loading performance</div>
        </div>

        <div class="panel-grid">
          <div class="panel panel-wide">
            <div class="panel-header">
              <h3>Protocol Distribution</h3>
              <span class="panel-meta">share of all connections</span>
            </div>
            <div id="protocol-bars"><div class="loading">Loading</div></div>
          </div>
        </div>

        <div class="panel panel-wide">
          <div class="panel-header">
            <h3>Protocols by Volume</h3>
            <span class="panel-meta">full breakdown</span>
          </div>
          <div class="table-wrap">
            <table class="data-table" id="protocol-table">
              <thead>
                <tr><th>Protocol</th><th>Connections</th><th>Share</th><th>Data Transferred</th></tr>
              </thead>
              <tbody><tr><td colspan="4"><div class="loading">Loading</div></td></tr></tbody>
            </table>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script src="../js/common.js"></script>
  <script src="../js/network-analytics.js"></script>
</body>
</html>
