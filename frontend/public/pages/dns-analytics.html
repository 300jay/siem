<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DNS Analytics · NetworkOps</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<!-- data-page tells common.js which sidebar item to highlight -->
<body data-page="dns">

  <div class="app-container">
    <!-- common.js inserts the sidebar here -->
    <main class="main-content">
      <!-- common.js inserts the top header here -->
      <div class="page-content">

        <div class="page-header">
          <h1>DNS Analytics</h1>
          <p class="page-description">Which domains the network is looking up, how often, and whether any of them look risky.</p>
        </div>

        <div class="page-controls">
          <button class="btn" id="refresh-btn">↻ Refresh</button>
          <button class="btn btn-primary export-btn">⬇ Export CSV</button>
        </div>

        <div id="dns-summary" class="stat-grid" style="margin-bottom:20px">
          <div class="loading">Loading summary</div>
        </div>

        <div class="panel-grid">
          <div class="panel panel-wide">
            <div class="panel-header">
              <h3>Most Queried Domains</h3>
              <span class="panel-meta">by lookup count</span>
            </div>
            <div id="dns-bars"><div class="loading">Loading</div></div>
          </div>
        </div>

        <div class="panel panel-wide">
          <div class="panel-header">
            <h3>Domain Detail</h3>
            <span class="panel-meta">with threat verdict</span>
          </div>
          <div class="table-wrap">
            <table class="data-table" id="dns-table">
              <thead>
                <tr><th>Domain</th><th>Record Type</th><th>Queries</th><th>Verdict</th></tr>
              </thead>
              <tbody><tr><td colspan="4"><div class="loading">Loading</div></td></tr></tbody>
            </table>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script src="../js/common.js"></script>
  <script src="../js/dns-analytics.js"></script>
</body>
</html>
